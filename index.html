<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLVK</title>

    <!-- Docsify 테마 -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <!-- Prism 구문 강조 테마 (다크) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">

    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="/custom.css">
</head>
<body>
    <div id="app"></div>

    <script>
        window.$docsify = {
            name: 'GLVK',
            loadSidebar: true,
            loadNavbar: true,
            subMaxLevel: 3,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
                '/.*/_navbar.md': '/_navbar.md'
            },

            // Giscus를 Docsify 플러그인으로 직접 삽입
            plugins: [
                function (hook, vm) {
                    hook.doneEach(function () {
                        // 기존 Giscus 관련 요소 제거
                        document.querySelectorAll('script[data-giscus], .giscus, iframe.giscus-frame').forEach(el => el.remove());

                        // 공식 Giscus 스크립트 생성
                        const script = document.createElement('script');
                        script.src = 'https://giscus.app/client.js';
                        script.setAttribute('data-repo', 'chema0992/glvk');
                        script.setAttribute('data-repo-id', 'R_kgDOUQ-P5w');
                        script.setAttribute('data-category', 'General');
                        script.setAttribute('data-category-id', 'DIC_kwDOUQ-P584DFXOY');
                        script.setAttribute('data-mapping', 'pathname');
                        script.setAttribute('data-strict', '1');
                        script.setAttribute('data-reactions-enabled', '1');
                        script.setAttribute('data-emit-metadata', '0');
                        script.setAttribute('data-input-position', 'top');
                        script.setAttribute('data-theme', 'light');      // 밝은 테마
                        script.setAttribute('data-lang', 'ko');
                        script.setAttribute('crossorigin', 'anonymous');
                        script.setAttribute('data-giscus', 'true');
                        script.async = true;

                        // body 맨 아래에 추가
                        document.body.appendChild(script);
                    });
                }
            ]
        };
    </script>

    <!-- Docsify -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

    <!-- Prism Autoloader (언어 자동 로딩) -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
