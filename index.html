<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLVK - Graphics API Learning Hub</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <!-- Docsify 기본 테마 -->
    <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
    <!-- 다크모드 테스트 -->
     <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" type="text/css">
    <!-- Prism 구문 강조 라이트 테마 -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
    <!-- Giscus 댓글 창 CSS (올바른 경로) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-giscus@1.0.2/dist/giscus.css">
    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="/custom.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'GLVK',
            loadSidebar: true,
            loadNavbar: true,
            subMaxLevel: 3,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
                '/.*/_navbar.md': '/_navbar.md'
            },
            darklightTheme: {
                siteFont: 'PT Sans',
                defaultTheme: 'light', // 기본 테마를 라이트모드로 지정
                codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
                bodyBaseColor: '#1a1a1a',
                dark: {
                    accent: '#e9ca42',
                    background: '#121212',
                    toggleColor: '#ffffff',
                    textColor: '#b3b3b3'
                },
                light: {
                    accent: '#e9ca42',
                    background: '#ffffff',
                    toggleColor: '#000000',
                    textColor: '#222222'
                }
            },
            search: {
                maxAge: 0, // 캐시 유효 기간 (ms 단위)
                paths: 'auto',    // 모든 마크다운 문서 자동 검색
                placeholder: '검색어를 입력하세요',
                noData: '검색 결과가 없습니다 😢',
                depth: 3,         // 검색할 헤더 깊이 (# ~ ######)
                hideOtherSidebarContent: false // 검색 시 사이드바의 다른 항목 숨김 여부
            },
            giscus: {
                repo: "chema0992/glvk",
                repoId: "R_kgDOUQ-P5w",
                category: "General",
                categoryId: "DIC_kwDOUQ-P584DFXOY",
                mapping: "pathname",
                strict: "1",
                reactionsEnabled: "1",
                emitMetadata: "0",
                inputPosition: "top",
                theme: "light",
                lang: "ko",
                crossorigin: "anonymous"
            }
        }
    </script>
    <!-- Docsify -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Docsify Darklight Theme Plugin -->
    <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
    <!-- Docsify Search Plugin -->
     <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- Giscus 플러그인 (올바른 파일명) -->
    <script src="//cdn.jsdelivr.net/npm/docsify-giscus@1.0.2/dist/docsify-giscus.min.js"></script>
    <!-- 구문 강조 -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-glsl.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
